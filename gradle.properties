# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3

# Mojang ships official mappings now; Yarn is no longer officially
# maintained for 1.21.11+, so this project uses Mojang mappings directly.
# ВАЖНО: версии loom/loader/fabric_version ниже меняются часто.
# Перед первой сборкой сверьте их с https://fabricmc.net/develop
# (или проще: сгенерируйте шаблон на https://fabricmc.net/develop и
# перенесите из него актуальные значения в этот файл — код мода менять не нужно).
loom_version=1.13

# Fabric API
fabric_version=0.141.3+1.21.11

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=serverdownloader
